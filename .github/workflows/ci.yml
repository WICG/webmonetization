name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run lint (Prettier + ESLint)
        run: npm run lint

      - name: Install tidy
        run: sudo apt-get update && sudo apt-get install -y tidy

      - name: Check spec formatting
        run: |
          npm run format:spec || true
          if ! git diff --exit-code --quiet specification/index.html; then
            echo "::error::specification/index.html is not formatted correctly. Run 'bun format:spec' locally and commit the changes."
            git diff specification/index.html
            exit 1
          fi
